name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Test e pacchetto .deb (Debian 12, glibc 2.36)
    runs-on: ubuntu-latest
    # The oldest supported base: a package built here also installs on Ubuntu 24.04+ and Debian 12+.
    container: debian:12
    steps:
      - name: Dipendenze di sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Dipendenze frontend e typecheck
        working-directory: app
        run: |
          npm ci
          npm run typecheck

      - name: Helper privilegiato (droidnative)
        run: cargo build --release --locked -p droidnative-cli

      - name: Pacchetto .deb
        working-directory: app
        run: npx tauri build --bundles deb

      - name: Controllo del pacchetto e checksum
        run: |
          cd target/release/bundle/deb
          dpkg-deb -I ./*.deb
          dpkg-deb -c ./*.deb | grep -E 'usr/bin/droidnative$|io.droidnative.policy|droidnative.desktop'
          sha256sum ./*.deb | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: droidnative-deb
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: droidnative-deb
          path: dist

      - name: Attestazione di provenienza
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb

      - name: Pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "manca $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "DroidNative ${GITHUB_REF_NAME}" --notes-file "$notes"
