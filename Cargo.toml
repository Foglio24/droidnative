[workspace]
resolver = "2"
members = ["crates/droidnative-core", "crates/droidnative-cli", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
repository = "https://github.com/Foglio24/droidnative"
authors = ["Foglio24 <82967977+Foglio24@users.noreply.github.com>"]

[workspace.dependencies]
droidnative-core = { path = "crates/droidnative-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
