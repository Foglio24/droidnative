# DroidNative: before every container start, re-point drm_device at the NVIDIA render node.
# On hybrid GPU systems the renderD numbers follow driver load order and can swap between boots;
# waydroid-nvidia's start check then refuses a drm_device left on the other GPU.
[Unit]
Wants=droidnative-render-node.service
After=droidnative-render-node.service
